[package]
name = "keycounter-native"
version = "0.1.0"
edition = "2021"
description = "KeyCounter 键盘鼠标统计工具（Rust 原生版）"

[[bin]]
name = "KeyCounterNative"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
serde_json = "1"
crossbeam-channel = "0.5"
tao = { version = "0.30", features = ["rwh_06"] }
wry = "0.46"
raw-window-handle = "0.6"
tray-icon = "0.19"
tiny-skia = { version = "0.11", features = ["png"] }
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
