<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyCounter 键盘鼠标统计</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">KC</div>
      <div>
        <h1>键盘鼠标统计</h1>
        <p id="status-text">正在连接统计服务...</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="unit-field">距离
        <select id="distance-unit">
          <option value="auto">自动</option>
          <option value="mm">毫米</option>
          <option value="cm">厘米</option>
          <option value="m">米</option>
          <option value="km">千米</option>
          <option value="inch">英寸</option>
          <option value="ft">英尺</option>
          <option value="px">像素</option>
        </select>
      </label>
      <label class="unit-field">关闭窗口
        <select id="close-action" class="settings-select">
          <option value="ask">每次询问</option>
          <option value="minimize">最小化到托盘</option>
          <option value="exit">直接退出</option>
        </select>
      </label>
      <label class="range-field">范围
        <select id="range-select">
          <option value="today">今日</option>
          <option value="yesterday">昨日</option>
          <option value="7d">近 7 天</option>
          <option value="30d">近 30 天</option>
          <option value="month">本月</option>
          <option value="all">全部时间</option>
          <option value="custom">自定义</option>
        </select>
        <input type="date" id="range-start" class="range-date" hidden>
        <input type="date" id="range-end" class="range-date" hidden>
      </label>
      <a class="action-button" href="/api/export?format=csv">导出数据</a>
      <a class="action-button" href="/api/export/heatmap.png">热力图 PNG</a>
      <button id="autostart-button" type="button">开启开机自启</button>
      <button id="pause-button" type="button">暂停统计</button>
      <span class="live-indicator" id="live-indicator">运行中</span>
    </div>
  </header>

  <main>
    <section class="stat-strip" aria-label="今日统计">
      <div class="stat-item"><strong id="stat-keys">--</strong><span>按键次数</span></div>
      <div class="stat-item"><strong id="stat-clicks">--</strong><span>鼠标点击</span></div>
      <div class="stat-item"><strong id="stat-scrolls">--</strong><span>滚轮次数</span></div>
      <div class="stat-item"><strong id="stat-distance">--</strong><span>移动距离</span></div>
    </section>

    <div class="workspace">
      <section class="panel heatmap-panel" aria-labelledby="heatmap-title">
        <div class="panel-head">
          <h2 id="heatmap-title">键盘热力图</h2>
          <div class="legend"><span>少</span><span class="legend-gradient"></span><span>多</span></div>
        </div>
        <div class="keyboard-stage">
          <div class="keyboard-holder" id="keyboard-holder">
            <div id="keyboard" class="keyboard"></div>
          </div>
        </div>
        <div class="heatmap-footer"><span id="heatmap-info">等待数据...</span></div>
      </section>

      <aside class="side-stack">
        <section class="panel mouse-panel" aria-labelledby="mouse-title">
          <h2 id="mouse-title">鼠标统计</h2>
          <dl class="mouse-list" id="mouse-list">
            <div><dt>左键</dt><dd id="mouse-left">--</dd></div>
            <div><dt>右键</dt><dd id="mouse-right">--</dd></div>
            <div><dt>中键</dt><dd id="mouse-middle">--</dd></div>
            <div><dt>侧键</dt><dd id="mouse-side">--</dd></div>
            <div><dt>滚轮上</dt><dd id="mouse-up">--</dd></div>
            <div><dt>滚轮下</dt><dd id="mouse-down">--</dd></div>
            <div><dt>移动距离</dt><dd id="mouse-distance">--</dd></div>
          </dl>
        </section>

        <section class="panel top-panel" aria-labelledby="top-title">
          <h2 id="top-title">最常用按键</h2>
          <ol class="top-list" id="top-list"></ol>
        </section>
      </aside>
    </div>

    <section class="panel trend-panel" aria-labelledby="trend-title">
      <div class="panel-head">
        <h2 id="trend-title">今日每小时趋势</h2>
        <p class="panel-note" id="trend-summary">正在统计今日按键与点击...</p>
        <div class="trend-legend">
          <span class="legend-key keys"></span>按键次数
          <span class="legend-key clicks"></span>鼠标点击
        </div>
      </div>
      <div id="trend-chart" class="trend-chart"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
